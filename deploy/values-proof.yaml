# Overrides for `make k8s-proof`.
#
# Committed next to the chart rather than buried in the script, so what the
# proof exercises and what the chart claims can be read side by side.
#
# The one real subtraction is ollama. Its image is 3.26 GB and its volume is
# 10.15 GB of model weights, and none of that changes whether an egress policy
# is enforced. Moving 13 GB to make a point about a firewall rule is how a
# proof becomes a thing nobody runs. The chart installs it by default; this
# file turns it off, and docs/kubernetes.md says so rather than leaving the
# gap to be discovered.

components:
  api: true
  mcp: true
  postgis: true
  qdrant: true
  ollama: false

persistence:
  ollama:  {enabled: false, size: 1Gi}
  postgis: {enabled: true,  size: 1Gi}
  qdrant:  {enabled: true,  size: 1Gi}

# Small enough to schedule on whatever the proof is running on.
resources:
  api:     {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 1Gi}}
  mcp:     {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 1Gi}}
  qdrant:  {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 1Gi}}
  postgis: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 1Gi}}
  ollama:  {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 1Gi}}

postgres:
  password: proof-only-not-a-secret

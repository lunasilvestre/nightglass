[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightglass"
version = "0.3.1"
description = "Air-gapped SAR intelligence assistant — dark-vessel detection and reporting"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Base install stays deliberately small: it is what the M1 air-gap proof runs
# against, and every extra wheel is another thing to bundle offline at M7.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
# What the containers install. Milestone-scoped extras below keep the image
# from carrying rasterio and GDAL before M3 needs them.
services = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "fastmcp>=2.0",
  "qdrant-client>=1.12",
  "psycopg[binary]>=3.2",
  "ollama>=0.3",
  "pyyaml>=6.0",       # corpus front-matter and sources.yaml
]
spatial = [           # M3
  "rasterio>=1.4",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=1.0",
  "pandas>=2.2",
]
# M3 evidence. A detector nobody can look at is a number nobody should believe:
# these render the SAR chips, the scene overview and the validation plots that
# justify the detections, and they run INSIDE the enclave because that is where
# the pixels are. Agg backend only — no display, no interactivity.
viz = [
  "matplotlib>=3.9",
]
agent = [             # M5
  "langgraph>=0.2",
  "langchain-core>=0.3",
  # The checkpointer is what makes §M5's "genuinely halts with inspectable
  # persisted state" true rather than asserted. MemorySaver would satisfy the
  # API and lose the claim: the state would live in the process that is
  # supposed to have stopped. Postgres is already in the stack, so the halted
  # graph is a row someone can SELECT, and a resume can happen in a different
  # container invocation entirely.
  "langgraph-checkpoint-postgres>=2.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
nightglass-mcp = "nightglass.mcp.server:main"
nightglass-agent = "nightglass.agent.main:main"
nightglass-corpus = "nightglass.rag.cli:main"
nightglass-spatial = "nightglass.spatial.cli:main"
nightglass-tools = "nightglass.tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# §M3's spatial join lives in .sql files, not in Python strings, because the
# milestone asks for it "as plain SQL, hand-checked" — and a query you can open
# and run a CTE at a time is checkable in a way an f-string is not.
[tool.setuptools.package-data]
nightglass = ["spatial/sql/*.sql"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters by CALLING Body()/Query()/Depends() in
# argument defaults. That is the framework's declaration idiom, not the
# shared-mutable-default bug B008 exists to catch. Configured once here rather
# than noqa'd at each of the six §5 tool endpoints.
extend-immutable-calls = [
  "fastapi.Body", "fastapi.Query", "fastapi.Path", "fastapi.Depends", "fastapi.File",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

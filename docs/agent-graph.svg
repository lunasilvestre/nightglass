<svg viewBox="0 0 1600 540" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fa8d0"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#48dc8c"/>
    </marker>
  </defs>

  <rect width="1600" height="540" fill="#0a0f18"/>

  <text x="60" y="52" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" fill="#617e9d">LangGraph state machine — src/nightglass/agent/graph.py</text>

  <!-- START -->
  <circle cx="70" cy="150" r="9" fill="none" stroke="#7fa8d0" stroke-width="2.5"/>
  <line x1="79" y1="150" x2="112" y2="150" stroke="#7fa8d0" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- chain nodes -->
  <g font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="bold">
    <rect x="118" y="112" width="110" height="76" rx="10" fill="#111a2a" stroke="#2a3d56"/>
    <text x="145" y="157" fill="#c4d2e2">parse</text>

    <rect x="264" y="112" width="100" height="76" rx="10" fill="#111a2a" stroke="#2a3d56"/>
    <text x="292" y="157" fill="#c4d2e2">plan</text>

    <rect x="400" y="112" width="110" height="76" rx="10" fill="#111a2a" stroke="#2a3d56"/>
    <text x="427" y="157" fill="#c4d2e2">tools</text>

    <rect x="546" y="112" width="150" height="76" rx="10" fill="#111a2a" stroke="#2a3d56"/>
    <text x="573" y="157" fill="#c4d2e2">correlate</text>

    <rect x="732" y="112" width="190" height="76" rx="10" fill="#111a2a" stroke="#2a3d56"/>
    <text x="759" y="157" fill="#c4d2e2">draft_intrep</text>

    <rect x="958" y="112" width="190" height="76" rx="10" fill="#161408" stroke="#6e5a28" stroke-width="2"/>
    <text x="1006" y="157" fill="#f5cd7e">HUMAN_GATE</text>
    <g fill="#f5cd7e"><rect x="981" y="140" width="5" height="20"/><rect x="990" y="140" width="5" height="20"/></g>

    <rect x="1184" y="112" width="140" height="76" rx="10" fill="#0f2418" stroke="#2f7e54" stroke-width="2"/>
    <text x="1218" y="157" fill="#48dc8c">release</text>
  </g>

  <!-- chain arrows -->
  <g stroke="#7fa8d0" stroke-width="2.5">
    <line x1="228" y1="150" x2="258" y2="150" marker-end="url(#arr)"/>
    <line x1="364" y1="150" x2="394" y2="150" marker-end="url(#arr)"/>
    <line x1="510" y1="150" x2="540" y2="150" marker-end="url(#arr)"/>
    <line x1="696" y1="150" x2="726" y2="150" marker-end="url(#arr)"/>
    <line x1="922" y1="150" x2="952" y2="150" marker-end="url(#arr)"/>
    <line x1="1148" y1="150" x2="1178" y2="150" marker-end="url(#arr)"/>
  </g>

  <!-- END -->
  <line x1="1324" y1="150" x2="1357" y2="150" stroke="#48dc8c" stroke-width="2.5" marker-end="url(#arrg)"/>
  <circle cx="1372" cy="150" r="9" fill="none" stroke="#48dc8c" stroke-width="2.5"/>
  <circle cx="1372" cy="150" r="4" fill="#48dc8c"/>

  <!-- annotations under nodes -->
  <g font-size="14" fill="#8ea6c0">
    <text x="400" y="216">the model picks tools —</text>
    <text x="400" y="236">bounded: max iterations,</text>
    <text x="400" y="256">repeat guard</text>

    <text x="732" y="216">claims templated from</text>
    <text x="732" y="236">results; releasable is</text>
    <text x="732" y="256">always False here</text>

    <text x="958" y="216" fill="#d8c9a2">interrupt() — the graph</text>
    <text x="958" y="236" fill="#d8c9a2">stops; the container</text>
    <text x="958" y="256" fill="#d8c9a2">may exit</text>

    <text x="1184" y="216">the only place</text>
    <text x="1184" y="236">releasable=True is set —</text>
    <text x="1184" y="256">reachable only via the gate</text>
  </g>

  <!-- checkpoint bar -->
  <line x1="118" y1="300" x2="1324" y2="300" stroke="#3d5a7e" stroke-width="1.5" stroke-dasharray="6 6"/>
  <g stroke="#3d5a7e" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="173" y1="188" x2="173" y2="300"/>
    <line x1="314" y1="188" x2="314" y2="300"/>
    <line x1="455" y1="188" x2="455" y2="300"/>
    <line x1="621" y1="188" x2="621" y2="300"/>
    <line x1="827" y1="188" x2="827" y2="300"/>
    <line x1="1053" y1="188" x2="1053" y2="300"/>
    <line x1="1254" y1="188" x2="1254" y2="300"/>
  </g>

  <!-- checkpointer -->
  <g>
    <path d="M560 340 a160 22 0 0 1 320 0 v96 a160 22 0 0 1 -320 0 z" fill="#111a2a" stroke="#2a3d56" stroke-width="2"/>
    <path d="M560 340 a160 22 0 0 0 320 0" fill="none" stroke="#2a3d56" stroke-width="2"/>
    <text x="640" y="398" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="16" font-weight="bold" fill="#c4d2e2">Postgres checkpointer</text>
    <text x="601" y="426" font-size="14" fill="#8ea6c0">every step persists — state survives the process</text>
  </g>
  <line x1="720" y1="300" x2="720" y2="336" stroke="#3d5a7e" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="4 4"/>

  <!-- resume path -->
  <path d="M884 430 H1254 V262" stroke="#48dc8c" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#arrg)"/>
  <text x="920" y="472" font-size="15" fill="#9fd2b6">make approve T=&lt;thread&gt; — a different container,</text>
  <text x="920" y="494" font-size="15" fill="#9fd2b6">minutes later, resumes from persisted state</text>

  <!-- gate decision note -->
  <text x="958" y="86" font-size="14" fill="#d8c9a2">approve, or reject with a reason —</text>
  <text x="958" y="104" font-size="14" fill="#d8c9a2">a rejected report stays NOT RELEASABLE</text>
</svg>

<svg viewBox="0 0 1600 880" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fa8d0"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="880" fill="#0a0f18"/>
  <g stroke="#8cb4dc" stroke-opacity="0.05">
    <path d="M0 220 H1600 M0 440 H1600 M0 660 H1600"/>
    <path d="M400 0 V880 M800 0 V880 M1200 0 V880"/>
  </g>

  <!-- title -->
  <text x="60" y="52" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" fill="#617e9d">measured, not asserted — every number here is regenerated by a make target</text>
  <text x="60" y="104" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="34" font-weight="bold" letter-spacing="6" fill="#eef5fc">WHAT IT MEASURES</text>
  <text x="60" y="138" font-size="20" fill="#9fb4cc">Kattegat validation AOI · one Sentinel-1 GRD granule · Danish Maritime Authority AIS as ground truth</text>

  <!-- ═══════════ PANEL 1 : the space–time join ═══════════ -->
  <rect x="60" y="178" width="1480" height="290" rx="14" fill="#101826" stroke="#26374e"/>

  <text x="90" y="216" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="bold" fill="#7fa8d0">1 · SAR DETECTIONS, JOINED TO AIS IN SPACE AND TIME</text>
  <text x="1510" y="216" text-anchor="end" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" fill="#617e9d">make dark-proof</text>

  <text x="90" y="272" font-size="19" fill="#c4d2e2">35 detections from the radar amplitude, each asked: was a vessel reporting itself there, then?</text>

  <!-- the stacked bar -->
  <g>
    <rect x="90" y="296" width="850" height="68" rx="6" fill="#48dc8c" fill-opacity="0.88"/>
    <rect x="944" y="296" width="566" height="68" rx="6" fill="#f5cd7e" fill-opacity="0.88"/>

    <text x="120" y="343" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="30" font-weight="bold" fill="#06210f">21</text>
    <text x="168" y="341" font-size="20" font-weight="bold" fill="#06210f">matched</text>

    <text x="974" y="343" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="30" font-weight="bold" fill="#231a05">14</text>
    <text x="1022" y="341" font-size="20" font-weight="bold" fill="#231a05">no AIS correspondence</text>
    <text x="1490" y="341" text-anchor="end" font-size="20" font-weight="bold" fill="#231a05">40.0%</text>
  </g>

  <!-- what each side means -->
  <g font-size="17">
    <line x1="90" y1="386" x2="90" y2="428" stroke="#48dc8c" stroke-width="3"/>
    <text x="110" y="402" fill="#9fd2b6">an AIS vessel within 500 m of where SAR would have</text>
    <text x="110" y="424" fill="#9fd2b6">drawn it, once azimuth displacement is corrected</text>

    <line x1="944" y1="386" x2="944" y2="428" stroke="#f5cd7e" stroke-width="3"/>
    <text x="964" y="402" fill="#d8c9a2">a lead for an analyst, not a finding — and not,</text>
    <text x="964" y="424" fill="#d8c9a2">on this detector, a dark-vessel rate. See below.</text>
  </g>

  <!-- ═══════════ PANEL 2 : four stat cards ═══════════ -->

  <!-- card A : median distance -->
  <g>
    <rect x="60" y="496" width="340" height="196" rx="12" fill="#101826" stroke="#26374e"/>
    <text x="86" y="530" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="14" fill="#7fa8d0">MEDIAN MATCH DISTANCE</text>
    <text x="86" y="588" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="46" font-weight="bold" fill="#eef5fc">104 m</text>
    <!-- scale bar: 0 to the 500 m radius, marker at 104 -->
    <rect x="86" y="612" width="288" height="10" rx="5" fill="#1b2942"/>
    <rect x="86" y="612" width="60" height="10" rx="5" fill="#48dc8c"/>
    <line x1="146" y1="606" x2="146" y2="628" stroke="#48dc8c" stroke-width="2"/>
    <text x="86" y="652" font-size="15" fill="#8ea6c0">against a 500 m match radius —</text>
    <text x="86" y="672" font-size="15" fill="#8ea6c0">the join is tight, not lucky</text>
  </g>

  <!-- card B : recall -->
  <g>
    <rect x="440" y="496" width="340" height="196" rx="12" fill="#101826" stroke="#26374e"/>
    <text x="466" y="530" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="14" fill="#7fa8d0">LARGE-VESSEL RECALL</text>
    <text x="466" y="588" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="46" font-weight="bold" fill="#eef5fc">100%</text>
    <rect x="466" y="612" width="288" height="10" rx="5" fill="#1b2942"/>
    <rect x="466" y="612" width="288" height="10" rx="5" fill="#48dc8c"/>
    <text x="466" y="652" font-size="15" fill="#8ea6c0">every AIS vessel over 200 m inside</text>
    <text x="466" y="672" font-size="15" fill="#8ea6c0">the scene footprint was found</text>
  </g>

  <!-- card C : the corpus -->
  <g>
    <rect x="820" y="496" width="340" height="196" rx="12" fill="#101826" stroke="#26374e"/>
    <text x="846" y="530" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="14" fill="#7fa8d0">GROUNDED ANSWERS</text>
    <text x="846" y="588" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="46" font-weight="bold" fill="#eef5fc">1,814</text>
    <text x="846" y="616" font-size="16" fill="#8ea6c0">chunks, from 60 documents</text>
    <text x="846" y="652" font-size="15" fill="#8ea6c0">embedded and served inside the</text>
    <text x="846" y="672" font-size="15" fill="#8ea6c0">enclave — or the system refuses</text>
  </g>

  <!-- card D : the gate -->
  <g>
    <rect x="1200" y="496" width="340" height="196" rx="12" fill="#101826" stroke="#26374e"/>
    <text x="1226" y="530" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="14" fill="#7fa8d0">AT THE HUMAN GATE</text>
    <text x="1226" y="588" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="46" font-weight="bold" fill="#eef5fc">18 / 0</text>
    <text x="1226" y="616" font-size="16" fill="#8ea6c0">claims / unsupported claims</text>
    <text x="1226" y="652" font-size="15" fill="#8ea6c0">each one carries the scene, detection</text>
    <text x="1226" y="672" font-size="15" fill="#8ea6c0">and document ids it rests on</text>
  </g>

  <!-- ═══════════ PANEL 3 : the caveat ═══════════ -->
  <rect x="60" y="720" width="1480" height="120" rx="12" fill="#1b1710" stroke="#6e5a28" stroke-width="2"/>

  <!-- warning triangle, drawn rather than typed -->
  <g transform="translate(104,780)">
    <path d="M0 -20 L20 16 L-20 16 Z" fill="none" stroke="#f5cd7e" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-2" y="-10" width="4" height="16" fill="#f5cd7e"/>
    <rect x="-2" y="9" width="4" height="4" fill="#f5cd7e"/>
  </g>

  <text x="152" y="762" font-size="20" font-weight="bold" fill="#f5cd7e">40% unmatched is not a 40% dark-vessel rate.</text>
  <text x="152" y="792" font-size="17" fill="#d8c9a2">Published work on Danish waters finds ~5% unmatched and ~0.4% genuinely dark after review. The excess here concentrates near shore, and</text>
  <text x="152" y="814" font-size="17" fill="#d8c9a2">does not fall below 23% even three kilometres offshore. The matcher is validated; this detector's precision is not good enough to quote a rate from.</text>

  <text x="1510" y="868" text-anchor="end" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" fill="#617e9d">docs/detection.md · docs/rag.md · docs/agent.md · docs/limitations.md</text>
</svg>

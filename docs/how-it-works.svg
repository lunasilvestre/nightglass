<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fa8d0"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#48dc8c"/>
    </marker>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfe8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cfe8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1600" height="1000" fill="#0a0f18"/>
  <g stroke="#8cb4dc" stroke-opacity="0.05">
    <path d="M0 250 H1600 M0 500 H1600 M0 750 H1600"/>
    <path d="M400 0 V1000 M800 0 V1000 M1200 0 V1000"/>
  </g>

  <!-- title -->
  <text x="60" y="78" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="42" font-weight="bold" letter-spacing="8" fill="#eef5fc">NIGHTGLASS</text>
  <text x="60" y="112" font-size="21" fill="#9fb4cc">How it works — from a radar echo to a report you can check</text>

  <!-- ═══════════ STEP 1 : satellite (outside the enclave) ═══════════ -->
  <g>
    <rect x="60" y="180" width="310" height="270" rx="14" fill="#101826" stroke="#26374e"/>
    <text x="84" y="218" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="16" font-weight="bold" fill="#7fa8d0">1 · THE SATELLITE LOOKS</text>

    <!-- satellite icon -->
    <g transform="translate(215,268)">
      <rect x="-16" y="-12" width="32" height="24" rx="3" fill="#c8d8ea"/>
      <rect x="-58" y="-8" width="34" height="16" rx="2" fill="#3b5a7e"/>
      <rect x="24" y="-8" width="34" height="16" rx="2" fill="#3b5a7e"/>
      <line x1="-24" y1="0" x2="-16" y2="0" stroke="#c8d8ea" stroke-width="3"/>
      <line x1="16" y1="0" x2="24" y2="0" stroke="#c8d8ea" stroke-width="3"/>
      <!-- radar pulses -->
      <g stroke="#5f9bd6" fill="none" stroke-width="2" stroke-opacity="0.8">
        <path d="M-14 22 A34 34 0 0 1 14 22"/>
        <path d="M-22 36 A50 50 0 0 1 22 36"/>
        <path d="M-30 50 A66 66 0 0 1 30 50"/>
      </g>
      <!-- sea -->
      <path d="M-70 72 q10 -7 20 0 q10 7 20 0 q10 -7 20 0 q10 7 20 0 q10 -7 20 0 q10 7 20 0" stroke="#2e4d6e" stroke-width="3" fill="none"/>
    </g>

    <text x="84" y="392" font-size="16" fill="#c4d2e2">Sentinel-1 radar images the sea —</text>
    <text x="84" y="415" font-size="16" fill="#c4d2e2">at night, and through cloud.</text>
  </g>

  <!-- arrow into the enclave -->
  <line x1="370" y1="315" x2="440" y2="315" stroke="#7fa8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="84" y="482" font-size="14" fill="#84a0be">imagery is loaded in, then the box is sealed</text>

  <!-- ═══════════ THE SEALED ENCLAVE ═══════════ -->
  <rect x="446" y="152" width="884" height="700" rx="18" fill="#0d1420" stroke="#3d5a7e" stroke-width="2.5"/>
  <rect x="454" y="160" width="868" height="684" rx="14" fill="none" stroke="#3d5a7e" stroke-width="1" stroke-dasharray="7 6" stroke-opacity="0.7"/>

  <!-- lock + enclave label -->
  <g transform="translate(486,152)">
    <rect x="-14" y="-13" width="28" height="26" rx="4" fill="#0a0f18" stroke="#48dc8c" stroke-width="2"/>
    <path d="M-7 -13 v-6 a7 7 0 0 1 14 0 v6" fill="none" stroke="#48dc8c" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#48dc8c"/>
  </g>
  <rect x="516" y="138" width="574" height="28" fill="#0a0f18"/>
  <text x="526" y="158" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="16" font-weight="bold" fill="#48dc8c">SEALED BOX — NO CONNECTION TO THE INTERNET, EVER</text>

  <!-- ── card 2 : find the ships ── -->
  <g>
    <rect x="486" y="200" width="390" height="270" rx="12" fill="#111a2a" stroke="#2a3d56"/>
    <text x="510" y="238" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="16" font-weight="bold" fill="#7fa8d0">2 · FIND THE SHIPS</text>
    <!-- SAR tile -->
    <g transform="translate(510,258)">
      <rect width="160" height="120" fill="#151d2b" stroke="#2a3d56"/>
      <g fill="#cfe8ff">
        <circle cx="38" cy="34" r="14" fill="url(#glow)"/><circle cx="38" cy="34" r="3.5"/>
        <circle cx="102" cy="58" r="14" fill="url(#glow)"/><circle cx="102" cy="58" r="3.5"/>
        <circle cx="66" cy="95" r="14" fill="url(#glow)"/><circle cx="66" cy="95" r="3.5"/>
      </g>
      <g fill="none" stroke="#48dc8c" stroke-width="1.5">
        <rect x="26" y="22" width="24" height="24"/>
        <rect x="90" y="46" width="24" height="24"/>
        <rect x="54" y="83" width="24" height="24"/>
      </g>
    </g>
    <text x="694" y="290" font-size="16" fill="#c4d2e2">A detector scans</text>
    <text x="694" y="313" font-size="16" fill="#c4d2e2">the radar picture</text>
    <text x="694" y="336" font-size="16" fill="#c4d2e2">for the bright</text>
    <text x="694" y="359" font-size="16" fill="#c4d2e2">echo of a hull.</text>
    <text x="510" y="418" font-size="15" fill="#8ea6c0">Each find gets a position and</text>
    <text x="510" y="440" font-size="15" fill="#8ea6c0">an estimated length.</text>
  </g>

  <!-- ── card 3 : check the broadcasts ── -->
  <g>
    <rect x="906" y="200" width="390" height="270" rx="12" fill="#111a2a" stroke="#2a3d56"/>
    <text x="930" y="238" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="16" font-weight="bold" fill="#7fa8d0">3 · CHECK WHO'S BROADCASTING</text>
    <!-- match illustration -->
    <g transform="translate(930,262)">
      <!-- matched pair -->
      <circle cx="20" cy="20" r="5" fill="#cfe8ff"/>
      <path d="M50 12 l12 8 -12 8 z" fill="#48dc8c"/>
      <line x1="28" y1="20" x2="47" y2="20" stroke="#48dc8c" stroke-width="2"/>
      <text x="75" y="26" font-size="15" fill="#9fe8c2">radar find ↔ AIS signal</text>
      <!-- matched pair 2 -->
      <circle cx="20" cy="58" r="5" fill="#cfe8ff"/>
      <path d="M50 50 l12 8 -12 8 z" fill="#48dc8c"/>
      <line x1="28" y1="58" x2="47" y2="58" stroke="#48dc8c" stroke-width="2"/>
      <text x="75" y="64" font-size="15" fill="#9fe8c2">matched in space and time</text>
      <!-- unmatched -->
      <circle cx="20" cy="102" r="5" fill="#cfe8ff"/>
      <text x="40" y="108" font-size="17" font-weight="bold" fill="#ff5c5c">?</text>
      <text x="75" y="108" font-size="15" fill="#f0a4a4">no signal at all</text>
    </g>
    <rect x="930" y="392" width="342" height="52" rx="8" fill="#2a1216" stroke="#7e3a3a"/>
    <text x="946" y="414" font-size="15" font-weight="bold" fill="#ff8a8a">A silent ship is a “dark” lead —</text>
    <text x="946" y="434" font-size="15" fill="#e0b0b0">a lead to investigate, not a verdict.</text>
  </g>

  <!-- ── card 4 : consult the library ── -->
  <g>
    <rect x="486" y="520" width="390" height="270" rx="12" fill="#111a2a" stroke="#2a3d56"/>
    <text x="510" y="558" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="16" font-weight="bold" fill="#7fa8d0">4 · CONSULT THE LIBRARY</text>
    <!-- stacked docs -->
    <g transform="translate(530,590)" stroke="#2a3d56">
      <rect x="16" y="16" width="86" height="110" rx="4" fill="#18222f"/>
      <rect x="8" y="8" width="86" height="110" rx="4" fill="#1b2735"/>
      <rect x="0" y="0" width="86" height="110" rx="4" fill="#1f2c3d"/>
      <g stroke="#54718f" stroke-width="2">
        <line x1="12" y1="22" x2="74" y2="22"/>
        <line x1="12" y1="40" x2="74" y2="40"/>
        <line x1="12" y1="58" x2="60" y2="58"/>
        <line x1="12" y1="76" x2="74" y2="76"/>
      </g>
    </g>
    <text x="660" y="612" font-size="16" fill="#c4d2e2">60 intelligence</text>
    <text x="660" y="635" font-size="16" fill="#c4d2e2">documents give</text>
    <text x="660" y="658" font-size="16" fill="#c4d2e2">context and</text>
    <text x="660" y="681" font-size="16" fill="#c4d2e2">doctrine.</text>
    <text x="510" y="738" font-size="15" fill="#8ea6c0">If the library can't support an answer,</text>
    <text x="510" y="760" font-size="15" fill="#8ea6c0">the system says so instead of guessing.</text>
  </g>

  <!-- ── card 5 : draft the report ── -->
  <g>
    <rect x="906" y="520" width="390" height="270" rx="12" fill="#111a2a" stroke="#2a3d56"/>
    <text x="930" y="558" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="16" font-weight="bold" fill="#7fa8d0">5 · DRAFT THE REPORT</text>
    <!-- report sheet -->
    <g transform="translate(950,586)">
      <rect width="120" height="150" rx="6" fill="#1f2c3d" stroke="#2a3d56"/>
      <text x="12" y="26" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="13" font-weight="bold" fill="#cfe0f2">INTREP</text>
      <g stroke="#54718f" stroke-width="2">
        <line x1="12" y1="44" x2="108" y2="44"/>
        <line x1="12" y1="62" x2="108" y2="62"/>
        <line x1="12" y1="80" x2="88" y2="80"/>
      </g>
      <g font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="11" font-weight="bold">
        <rect x="10" y="96" width="52" height="18" rx="4" fill="#132b1f"/><text x="16" y="109" fill="#48dc8c">scene</text>
        <rect x="66" y="96" width="44" height="18" rx="4" fill="#132b1f"/><text x="72" y="109" fill="#48dc8c">det</text>
        <rect x="10" y="120" width="42" height="18" rx="4" fill="#132b1f"/><text x="16" y="133" fill="#48dc8c">doc</text>
      </g>
    </g>
    <text x="1100" y="612" font-size="16" fill="#c4d2e2">Every claim</text>
    <text x="1100" y="635" font-size="16" fill="#c4d2e2">carries the IDs</text>
    <text x="1100" y="658" font-size="16" fill="#c4d2e2">of the evidence</text>
    <text x="1100" y="681" font-size="16" fill="#c4d2e2">it rests on.</text>
    <text x="1100" y="720" font-size="15" fill="#8ea6c0">Nothing has to be</text>
    <text x="1100" y="742" font-size="15" fill="#8ea6c0">taken on trust.</text>
  </g>

  <!-- flow arrows inside enclave -->
  <line x1="876" y1="335" x2="900" y2="335" stroke="#7fa8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1101" y1="470" x2="1101" y2="514" stroke="#7fa8d0" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="876" y1="655" x2="900" y2="655" stroke="#7fa8d0" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ═══════════ STEP 6 : the human gate (leaving the enclave) ═══════════ -->
  <!-- gate gap in the wall -->
  <rect x="1318" y="600" width="24" height="110" fill="#0a0f18"/>
  <line x1="1330" y1="596" x2="1330" y2="714" stroke="#f5cd7e" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="1296" y1="655" x2="1368" y2="655" stroke="#f5cd7e" stroke-width="2.5" marker-end="url(#arrg)" stroke-opacity="0"/>
  <line x1="1300" y1="655" x2="1372" y2="655" stroke="#7fa8d0" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="1378" y="520" width="162" height="270" rx="12" fill="#161408" stroke="#6e5a28"/>
    <text x="1398" y="558" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="16" font-weight="bold" fill="#f5cd7e">6 · A HUMAN</text>
    <text x="1398" y="580" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="16" font-weight="bold" fill="#f5cd7e">DECIDES</text>
    <!-- person -->
    <g transform="translate(1459,650)" fill="#e8d9b0">
      <circle cx="0" cy="-16" r="13"/>
      <path d="M-24 30 a24 24 0 0 1 48 0 z"/>
    </g>
    <text x="1398" y="716" font-size="15" fill="#d8c9a2">The system halts</text>
    <text x="1398" y="738" font-size="15" fill="#d8c9a2">until an analyst</text>
    <text x="1398" y="760" font-size="15" fill="#d8c9a2">approves release.</text>
  </g>

  <!-- released report -->
  <line x1="1459" y1="790" x2="1459" y2="836" stroke="#48dc8c" stroke-width="2.5" marker-end="url(#arrg)"/>
  <g>
    <rect x="1352" y="842" width="214" height="66" rx="10" fill="#0f2418" stroke="#2f7e54"/>
    <text x="1374" y="870" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" font-weight="bold" fill="#48dc8c">RELEASABLE INTREP</text>
    <text x="1374" y="892" font-size="14" fill="#9fd2b6">checked, cited, approved</text>
  </g>

  <!-- why sealed, bottom-left -->
  <text x="60" y="560" font-size="17" font-weight="bold" fill="#c4d2e2">Why a sealed box?</text>
  <text x="60" y="588" font-size="15" fill="#8ea6c0">Sensitive analysis shouldn't leak.</text>
  <text x="60" y="610" font-size="15" fill="#8ea6c0">The AI model, the search index and</text>
  <text x="60" y="632" font-size="15" fill="#8ea6c0">the databases all live inside the box.</text>
  <text x="60" y="654" font-size="15" fill="#8ea6c0">Nothing phones home — there is</text>
  <text x="60" y="676" font-size="15" fill="#8ea6c0">literally no route out.</text>

  <text x="60" y="736" font-size="15" fill="#617e9d">On a real validation day off Denmark:</text>
  <text x="60" y="758" font-size="15" fill="#617e9d">21 of 35 radar finds matched a known</text>
  <text x="60" y="780" font-size="15" fill="#617e9d">vessel — at a median 104 metres.</text>

  <!-- footer -->
  <line x1="60" y1="930" x2="1540" y2="930" stroke="#26374e"/>
  <text x="60" y="966" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" fill="#617e9d">Sentinel-1 · AIS · PostGIS · Qdrant · Ollama · LangGraph · MCP — everything runs locally</text>
  <text x="1540" y="966" text-anchor="end" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="15" fill="#617e9d">github.com/lunasilvestre/nightglass</text>
</svg>

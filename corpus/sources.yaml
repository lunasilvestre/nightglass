  # something because there is a standing obligation to transmit; A.1106(29) is
  # where that obligation and its narrow exceptions are actually written down.
  # An assistant that cannot cite this is asserting the domain, not sourcing it.
  - publisher: International Maritime Organization
    doc_type: regulation
    format: pdf
    language: en
    classification: UNCLASSIFIED
    licence: >-
      (c) International Maritime Organization. Published resolutions from the
      IMO Knowledge Centre index; no open licence is stated. Fetched locally for
      retrieval, never redistributed by this repository.
    redistributable: false
    fetch_base: https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/
    items:

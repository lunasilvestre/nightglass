  # ---------------------------------------------------------------------------
  # EU law — the AIS obligation inside EU waters, and switching it off as an act
  # ---------------------------------------------------------------------------
  # 2002/59/EC Article 6 is the "shall maintain it in operation at all times"
  # clause. 2023/1214 is the one that names AIS interruption as sanctionable
  # conduct in its own right, which is precisely the distance between "a gap in
  # the data" and "a reportable event".
  - publisher: European Union
    doc_type: regulation
    format: pdf
    language: en
    classification: UNCLASSIFIED
    licence: >-
      (c) European Union, 1998-2026. Reuse authorised under Commission Decision
      2011/833/EU provided the source is acknowledged. Only European Union
      legislation printed in the paper Official Journal is deemed authentic.
    redistributable: true
    fetch_base: "https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:"
    source_base: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:"
    items:
      - doc_id: eu-2002-59-vessel-traffic-monitoring
        title: >-
          Directive 2002/59/EC — Community Vessel Traffic Monitoring and
          Information System
        path: 32002L0059
        page: 32002L0059
      - doc_id: eu-2009-16-port-state-control
        title: Directive 2009/16/EC — Port State Control
        path: 32009L0016
        page: 32009L0016
      - doc_id: eu-725-2004-ship-port-security
        title: >-
          Regulation (EC) No 725/2004 — Enhancing Ship and Port Facility
          Security
        path: 32004R0725
        page: 32004R0725
      - doc_id: eu-2005-35-ship-source-pollution
        title: Directive 2005/35/EC — Ship-Source Pollution and Penalties for Infringements
        path: 32005L0035
        page: 32005L0035
      - doc_id: eu-1406-2002-emsa
        title: >-
          Regulation (EC) No 1406/2002 — Establishing the European Maritime

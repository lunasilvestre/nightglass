# NIGHTGLASS — the real half of the document corpus (EXECUTION_SPEC §3.3).
#
# This file is a MANIFEST, not the documents. Nothing here is vendored into the
# repository: `make fetch-corpus` downloads each entry at provisioning time into
# `data/corpus/`, which is gitignored. Three reasons, in order of importance:
#
#   1. LICENCE. Some publishers below grant no reuse licence at all (see
#      `redistributable: false`). Fetching a public document onto the machine
#      that will read it is not redistribution; committing it to a public git
#      repository is. The flag is machine-readable rather than a comment so the
#      fetcher can enforce it -- entries marked false may only ever be written
#      to gitignored paths, and `make fetch-corpus` fails loudly if that is
#      violated rather than quietly doing the wrong thing.
#   2. HONESTY OF PROVENANCE. §7 requires every claim to be traceable to a
#      source. A URL plus a sha256 recorded at fetch time is traceable; a text
#      file of unknown vintage sitting in `data/` is not.
#   3. It is the same provisioning/operation split as `make pull-models`:
#      acquisition is online and explicit, operation is offline and sealed.
#
# The synthetic half of the corpus lives in `corpus/synthetic/` and IS committed
# --- it has to be, or a fresh clone cannot reproduce the demo, and there is no
# URL to fetch an invented memo from.
#
# ---------------------------------------------------------------------------
# Adding a source: append an item to the right group, or add a group. The only
# required per-item fields are `doc_id`, `title` and `path`. `doc_id` is the
# stable citation key an INTREP will carry, so treat it as an identifier, not a
# label -- renaming one orphans every chunk already indexed under it.

version: 1

groups:

  # ---------------------------------------------------------------------------
  # ICEYE product documentation
  # ---------------------------------------------------------------------------
  # NIGHTGLASS is deliberately shaped as the open-source shadow of ICEYE Ocean
  # Vision Detect, so the vendor's own SAR documentation is the most on-point
  # technical text available anywhere in this corpus: imaging geometry, azimuth,
  # radiometric calibration, geolocation accuracy, product levels. It is also
  # what makes a question like "why does a moving ship appear displaced?"
  # answerable from sources rather than from model priors.
  #
  # Fetched from the documentation's own git source at a PINNED COMMIT rather
  # than by scraping the rendered site. The published site is `latest` and moves;
  # a commit sha does not, and an air-gapped system whose corpus cannot be
  # rebuilt byte-for-byte is not reproducible. `source_url` still points at the
  # human-readable page, because that is what an analyst following a citation
  # would actually open.
  - publisher: ICEYE Ltd
    doc_type: technical-documentation
    format: markdown
    language: en
    classification: UNCLASSIFIED
    # The repository is public and carries no LICENSE file, and the API reports
    # no licence. Absent an explicit grant, default copyright applies: readable,
    # not redistributable.
    licence: >-
      (c) ICEYE Ltd. Public product documentation; no open licence is stated by
      the publisher. Fetched locally for retrieval, never redistributed by this
      repository.
    redistributable: false
    fetch_base: https://raw.githubusercontent.com/iceye-ltd/product-documentation/6c4256836fd03a1d0fb88c48f9efa1f982e1f28c/docs/
    source_base: https://sar.iceye.com/latest/
    items:
      - doc_id: iceye-sar-overview
        title: An Overview of SAR Imaging
        path: foundations/OverviewOfSAR/overviewOfSAR.md
        page: foundations/OverviewOfSAR/overviewOfSAR/
      - doc_id: iceye-sar-simple-imaging
        title: A Simple Form of Imaging
        path: foundations/OverviewOfSAR/simpleFormOfImaging.md
        page: foundations/OverviewOfSAR/simpleFormOfImaging/
      - doc_id: iceye-sar-range-resolution
        title: Range Resolution

  # ---------------------------------------------------------------------------
  # Copernicus EMS — real activations over the Lisbon AOI
  # ---------------------------------------------------------------------------
  # Not maritime-security documents, and included knowing that. What they give
  # the corpus is real, dated, citable environmental context for the demo AOI:
  # what the sea state and the coast were doing, from an EU source an analyst
  # would actually accept. EMSR861 and EMSR864 are the two named in §3.3;
  # EMSR842 and EMSR908 are the other two Portugal-touching activations found by
  # scanning the public activation API (EMSR840-EMSR915), so the selection is
  # a filter over the catalogue rather than a hand-picked pair.
  #
  # Fetched as JSON from the activation API and rendered to a narrative memo --
  # the human-facing pages are a JavaScript-rendered SPA whose HTML contains
  # none of the text.
  - publisher: Copernicus Emergency Management Service
    doc_type: activation-report
    format: copernicus-ems-activation
    language: en
    classification: UNCLASSIFIED
    licence: >-
      (c) European Union, Copernicus Emergency Management Service. Free, full and
      open access under the Copernicus data policy, with attribution.
    redistributable: true
    fetch_base: "https://rapidmapping.emergency.copernicus.eu/backend/dashboard-api/public-activations/?code="
    source_base: "https://mapping.emergency.copernicus.eu/activations/"
    items:
      - doc_id: ems-emsr861-storm-kristin-portugal
        title: >-
          EMSR861 — Storm Kristin and Flooding in Central Portugal, Galicia and
          Andalusia, Spain
        path: EMSR861
        page: EMSR861/
      - doc_id: ems-emsr864-coastal-flood-portugal
